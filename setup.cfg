[flake8]
max-line-length = 120
exclude = venv,migrations,.git,__pycache__
# I prompt degli agenti sono testo naturale in stringhe multi-riga:
# spezzarli a 120 caratteri li renderebbe illeggibili e non è possibile
# usare "# noqa" dentro una stringa. Esentati solo da E501.
per-file-ignores =
    ai_service/agents/*.py: E501
# In settings.py timedelta e crontab sono importati accanto ai blocchi
# di configurazione che li usano (SIMPLE_JWT, CELERY_BEAT_SCHEDULE),
# scelta deliberata di leggibilita'.
    remembro_backend/settings.py: E402
